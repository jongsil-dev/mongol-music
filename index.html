<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="몽골 음악" />
  <meta name="theme-color" content="#0d111a" />
  <title>몽골 음악 · Mongol Music</title>
  <style>
    :root {
      --bg: #0d111a;
      --card: #161d2b;
      --card-active: #1f293d;
      --border: rgba(255, 255, 255, 0.08);
      --gold: #eab308;
      --gold-soft: rgba(234, 179, 8, 0.16);
      --sky: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #f87171;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      overscroll-behavior-y: contain;
    }
    body {
      padding-top: calc(14px + var(--safe-top));
      padding-bottom: calc(116px + var(--safe-bottom));
      min-height: 100dvh;
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 0 16px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 38px; height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #eab308, #ca8a04);
      color: #0d111a;
      display: grid; place-items: center;
      font-size: 20px; font-weight: 800;
      box-shadow: 0 6px 18px rgba(234, 179, 8, 0.25);
    }
    .brand h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand p {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--muted);
    }
    .live-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--gold);
      background: var(--gold-soft);
      border: 1px solid rgba(234, 179, 8, 0.3);
      padding: 5px 10px;
      border-radius: 999px;
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--card);
      padding: 5px;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .tab-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      padding: 10px 8px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.18s;
    }
    .tab-btn.active {
      background: var(--gold);
      color: #0d111a;
      font-weight: 700;
    }
    .panel { display: none; }
    .panel.active { display: block; }

    .tip-box {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #bae6fd;
      font-size: 12.5px;
      line-height: 1.45;
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 14px;
    }

    .station-list, .track-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.12s, background 0.18s, border-color 0.18s;
    }
    .card:active { transform: scale(0.985); }
    .card.playing {
      background: var(--card-active);
      border-color: rgba(234, 179, 8, 0.55);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }
    .icon-box {
      width: 46px; height: 46px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      display: grid; place-items: center;
      font-size: 21px;
      flex-shrink: 0;
    }
    .card.playing .icon-box {
      background: var(--gold-soft);
    }
    .info { flex: 1; min-width: 0; }
    .title {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sub {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .play-pill {
      font-size: 12px;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      flex-shrink: 0;
    }
    .card.playing .play-pill {
      background: var(--gold);
      color: #0d111a;
    }

    /* YouTube Section */
    .yt-wrap {
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      aspect-ratio: 16 / 9;
      margin-bottom: 12px;
      position: relative;
    }
    .yt-wrap iframe {
      width: 100%; height: 100%; border: 0;
    }
    .yt-placeholder {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: var(--muted); font-size: 13.5px;
      gap: 6px; padding: 16px; text-align: center;
    }
    .chips {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 999px;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: var(--gold-soft);
      border-color: var(--gold);
      color: var(--gold);
    }
    .fav-btn {
      border: 0;
      background: transparent;
      font-size: 18px;
      padding: 4px 6px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .yt-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn-sm {
      flex: 1;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
      padding: 9px 10px;
      border-radius: 11px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    /* Sticky Bottom Radio Player */
    .mini-bar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: rgba(18, 24, 38, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding: 10px 16px calc(12px + var(--safe-bottom));
      z-index: 50;
    }
    .mini-inner {
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .mini-meta { flex: 1; min-width: 0; }
    .mini-title {
      font-size: 14px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mini-status {
      font-size: 12px; color: var(--gold); margin-top: 2px;
    }
    .mini-status.err { color: var(--danger); }
    .mini-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 0;
      background: var(--gold);
      color: #0d111a;
      font-size: 17px; font-weight: 800;
      display: grid; place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .mini-btn:disabled { opacity: 0.4; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">🇲🇳</div>
        <div>
          <h1>몽골 음악 플레이어</h1>
          <p>Mongol Radio &amp; Top Tracks</p>
        </div>
      </div>
      <div class="live-badge" id="modeBadge">라디오 대기</div>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-tab="radio">📻 실시간 라디오</button>
      <button class="tab-btn" data-tab="music">🎵 추천 음악</button>
    </div>

    <!-- TAB 1: RADIO -->
    <section class="panel active" id="panel-radio">
      <div class="tip-box">
        💡 실시간 라디오는 <strong>아이폰 화면을 꺼도(잠금 화면에서도)</strong> 계속 재생됩니다. 채널을 눌러 바로 들어보세요.
      </div>
      <div class="station-list" id="stationList"></div>
    </section>

    <!-- TAB 2: YOUTUBE MUSIC -->
    <section class="panel" id="panel-music">
      <div class="yt-wrap" id="ytWrap">
        <div class="yt-placeholder" id="ytPlaceholder">
          <div style="font-size:26px;">🎧</div>
          <div>아래에서 듣고 싶은 몽골 음악을 선택하세요.<br/>(유튜브 연동 · 화면을 켜 둔 상태에서 재생됩니다)</div>
        </div>
      </div>
      <div class="yt-actions" id="ytActions" style="display:none;">
        <button class="btn-sm" id="prevTrackBtn">⏮ 이전 곡</button>
        <button class="btn-sm" id="nextTrackBtn">⏭ 다음 곡</button>
        <a class="btn-sm" id="openYtLink" target="_blank" rel="noopener">유튜브 앱으로 열기 ↗</a>
      </div>
      <div class="chips" id="genreChips"></div>
      <div class="track-list" id="trackList"></div>
    </section>
  </div>

  <!-- STICKY MINI BAR -->
  <div class="mini-bar">
    <div class="mini-inner">
      <div class="icon-box" style="width:40px;height:40px;font-size:18px;" id="miniIcon">📻</div>
      <div class="mini-meta">
        <div class="mini-title" id="miniTitle">라디오 채널을 선택해 주세요</div>
        <div class="mini-status" id="miniStatus">화면 꺼도 백그라운드 재생 지원</div>
      </div>
      <button class="mini-btn" id="miniPlayBtn" disabled>▶</button>
    </div>
  </div>

  <audio id="radioAudio" preload="none" playsinline></audio>

  <script>
    const STATIONS = [
      {
        id: 'xadun',
        name: 'Xadun 107.5 FM',
        desc: '몽골 팝 · 올디스 · 록 & 대중음악',
        icon: '🎸',
        url: 'https://stream.zeno.fm/z3sbdspshrhvv'
      },
      {
        id: 'ehlel',
        name: 'Ehlelradio',
        desc: '울란바토르 최신 음악 · 토크',
        icon: '🎧',
        url: 'https://stream.zeno.fm/c6cvywws538uv'
      },
      {
        id: 'family',
        name: 'Гэр бүлийн радио 104.5',
        desc: '따뜻한 몽골 감성 · 패밀리 컬처',
        icon: '☀️',
        url: 'https://c2.radioboss.fm/stream/394'
      },
      {
        id: 'mnb2',
        name: 'Хөх тэнгэр (MNB Radio 2)',
        desc: '몽골 공영 문화 · 전통 · 예술',
        icon: '🐎',
        url: 'https://live.mnb.mn/hls/radio2.stream.m3u8'
      },
      {
        id: 'mnb1',
        name: 'Монголын радио (MNB 1)',
        desc: '몽골 공영 방송 · 현지 소식',
        icon: '📻',
        url: 'https://live.mnb.mn/hls/radio1.stream.m3u8'
      }
    ];

    const TRACKS = [
      { id: 'iE73seZ_YBg', title: '몽골 러브송 논스톱 믹스 (45분+)', artist: 'HipHop · Pop · R&B Live Set', genre: '힙합/R&B' },
      { id: 'kY0XWCNBjLg', title: 'ATM', artist: 'Ginjin & Mrs M', genre: '힙합/R&B' },
      { id: 'X8zaN1OyZdA', title: 'Zunii Gunig (여름의 슬픔)', artist: 'Ginjin, Ebo, Mrs M & Bay', genre: '힙합/R&B' },
      { id: 'YukzSmskh_U', title: 'No Selgee', artist: 'Ginjin ft. Big Gee', genre: '힙합/R&B' },
      { id: 'I5w2QEA_5zg', title: 'Blue', artist: 'Mrs M', genre: '힙합/R&B' },
      { id: '8h_hS0d4vqg', title: 'Mongolian Rap & Hoomii Fusion', artist: '몽골 랩 & 전통 호미', genre: '힙합/R&B' },
      { id: 'v4xZUr0BEfE', title: 'Yuve Yuve Yu', artist: 'The HU (훈누 록)', genre: '훈누 록' },
      { id: 'jM8dCGIm6yc', title: 'Wolf Totem', artist: 'The HU (훈누 록)', genre: '훈누 록' },
      { id: 'SNCx4n2m5_o', title: 'Shireg Shireg', artist: 'The HU (훈누 록)', genre: '훈누 록' },
      { id: 'p_5yt5IX38I', title: 'In Praise of Chinggis Khaan', artist: 'Batzorig Vaanchig (후미·마두금)', genre: '전통/마두금' },
      { id: 'd6DBe4XVgSU', title: 'Yuve Yuve Yu 마두금(Morin Khuur) 커버', artist: '마두금 연주', genre: '전통/마두금' },
      { id: '6l9zhmgEqyM', title: '몽골 전통 장가(우르틴 두) & 마두금', artist: 'Mongolian Long Song', genre: '전통/마두금' }
    ];

    const audio = document.getElementById('radioAudio');
    const stationListEl = document.getElementById('stationList');
    const trackListEl = document.getElementById('trackList');
    const genreChipsEl = document.getElementById('genreChips');
    const miniTitle = document.getElementById('miniTitle');
    const miniStatus = document.getElementById('miniStatus');
    const miniIcon = document.getElementById('miniIcon');
    const miniPlayBtn = document.getElementById('miniPlayBtn');
    const modeBadge = document.getElementById('modeBadge');
    const ytWrap = document.getElementById('ytWrap');
    const ytActions = document.getElementById('ytActions');
    const openYtLink = document.getElementById('openYtLink');

    let currentStation = null;
    let isPlaying = false;
    let currentGenre = '전체';
    let currentTrackId = null;
    let favs = JSON.parse(localStorage.getItem('mn_music_favs') || '[]');

    // Tabs
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      });
    });

    function setRadioStatus(text, isErr = false) {
      miniStatus.textContent = text;
      miniStatus.className = 'mini-status' + (isErr ? ' err' : '');
    }

    function updateMediaSession(station) {
      if ('mediaSession' in navigator && station) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: station.name,
          artist: station.desc,
          album: 'Mongol Music Live'
        });
        navigator.mediaSession.setActionHandler('play', () => toggleRadio());
        navigator.mediaSession.setActionHandler('pause', () => toggleRadio());
      }
    }

    function playStation(st) {
      if (currentStation && currentStation.id === st.id) {
        toggleRadio();
        return;
      }
      currentStation = st;
      miniIcon.textContent = st.icon;
      miniTitle.textContent = st.name;
      miniPlayBtn.disabled = false;
      setRadioStatus('연결 중...');
      modeBadge.textContent = '연결 중';
      audio.src = st.url;
      audio.play().then(() => {
        isPlaying = true;
        miniPlayBtn.textContent = '⏸';
        setRadioStatus('실시간 재생 중 · 화면 꺼도 유지');
        modeBadge.textContent = 'LIVE ON';
        updateMediaSession(st);
        renderStations();
      }).catch(() => {
        isPlaying = false;
        miniPlayBtn.textContent = '▶';
        setRadioStatus('이 채널은 지금 연결이 어렵습니다. 다른 채널을 눌러보세요.', true);
        modeBadge.textContent = '연결 실패';
        renderStations();
      });
      renderStations();
    }

    function toggleRadio() {
      if (!currentStation) return;
      if (audio.paused) {
        setRadioStatus('다시 연결 중...');
        audio.play().then(() => {
          isPlaying = true;
          miniPlayBtn.textContent = '⏸';
          setRadioStatus('실시간 재생 중 · 화면 꺼도 유지');
          modeBadge.textContent = 'LIVE ON';
          renderStations();
        }).catch(() => {
          setRadioStatus('재생에 실패했습니다. 다시 눌러보세요.', true);
        });
      } else {
        audio.pause();
        isPlaying = false;
        miniPlayBtn.textContent = '▶';
        setRadioStatus('일시 정지됨');
        modeBadge.textContent = '일시정지';
        renderStations();
      }
    }

    audio.addEventListener('error', () => {
      if (currentStation) {
        isPlaying = false;
        miniPlayBtn.textContent = '▶';
        setRadioStatus('스트림 신호가 불안정합니다. 다른 채널을 선택해 보세요.', true);
        modeBadge.textContent = '신호 끊김';
        renderStations();
      }
    });

    miniPlayBtn.addEventListener('click', toggleRadio);

    function renderStations() {
      stationListEl.innerHTML = STATIONS.map(st => {
        const active = currentStation && currentStation.id === st.id;
        const label = active ? (isPlaying ? '재생 중' : '정지됨') : '듣기';
        return `
          <div class="card ${active && isPlaying ? 'playing' : ''}" onclick="playStationById('${st.id}')">
            <div class="icon-box">${st.icon}</div>
            <div class="info">
              <div class="title">${st.name}</div>
              <div class="sub">${st.desc}</div>
            </div>
            <div class="play-pill">${label}</div>
          </div>
        `;
      }).join('');
    }
    window.playStationById = (id) => {
      const st = STATIONS.find(s => s.id === id);
      if (st) playStation(st);
    };

    // YouTube Tracks
    function getFilteredTracks() {
      if (currentGenre === '전체') return TRACKS;
      if (currentGenre === '즐겨찾기') return TRACKS.filter(t => favs.includes(t.id));
      return TRACKS.filter(t => t.genre === currentGenre);
    }

    function renderGenres() {
      const genres = ['전체', '즐겨찾기', '힙합/R&B', '훈누 록', '전통/마두금'];
      genreChipsEl.innerHTML = genres.map(g =>
        `<button class="chip ${currentGenre === g ? 'active' : ''}" onclick="setGenre('${g}')">${g}</button>`
      ).join('');
    }
    window.setGenre = (g) => {
      currentGenre = g;
      renderGenres();
      renderTracks();
    };

    function playTrack(id) {
      // 유튜브 재생 시 라디오는 일시정지해서 소리 겹침 방지
      if (!audio.paused) {
        audio.pause();
        isPlaying = false;
        miniPlayBtn.textContent = '▶';
        setRadioStatus('유튜브 재생 중 · 라디오 일시 정지');
        modeBadge.textContent = '유튜브';
        renderStations();
      }
      currentTrackId = id;
      ytWrap.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
      ytActions.style.display = 'flex';
      openYtLink.href = `https://www.youtube.com/watch?v=${id}`;
      renderTracks();
    }
    window.playTrack = playTrack;

    window.toggleFav = (e, id) => {
      e.stopPropagation();
      if (favs.includes(id)) favs = favs.filter(x => x !== id);
      else favs.push(id);
      localStorage.setItem('mn_music_favs', JSON.stringify(favs));
      renderTracks();
    };

    function stepTrack(delta) {
      const list = getFilteredTracks();
      if (!list.length) return;
      const idx = list.findIndex(t => t.id === currentTrackId);
      const next = idx === -1 ? 0 : (idx + delta + list.length) % list.length;
      playTrack(list[next].id);
    }
    document.getElementById('prevTrackBtn').addEventListener('click', () => stepTrack(-1));
    document.getElementById('nextTrackBtn').addEventListener('click', () => stepTrack(1));

    function renderTracks() {
      const list = getFilteredTracks();
      if (!list.length) {
        trackListEl.innerHTML = `<div style="text-align:center;color:var(--muted);padding:28px 0;font-size:13.5px;">아직 즐겨찾기한 곡이 없어요. 하트(♡)를 눌러 담아보세요!</div>`;
        return;
      }
      trackListEl.innerHTML = list.map(t => {
        const active = currentTrackId === t.id;
        const isFav = favs.includes(t.id);
        return `
          <div class="card ${active ? 'playing' : ''}" onclick="playTrack('${t.id}')">
            <div class="icon-box">${active ? '🔊' : '🎵'}</div>
            <div class="info">
              <div class="title">${t.title}</div>
              <div class="sub">${t.artist} · ${t.genre}</div>
            </div>
            <button class="fav-btn" onclick="toggleFav(event, '${t.id}')" aria-label="즐겨찾기">${isFav ? '💛' : '🤍'}</button>
          </div>
        `;
      }).join('');
    }

    renderStations();
    renderGenres();
    renderTracks();
  </script>
</body>
</html>
